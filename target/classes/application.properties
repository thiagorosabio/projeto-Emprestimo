# Lucas: servidor usa a porta da plataforma quando publicada e 8080 localmente.
server.port=${PORT:8080}

# Lucas: H2 em arquivo mantém os cadastros mesmo após reiniciar a aplicação.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./dados/emprestimos;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# Lucas: console é útil em desenvolvimento; desabilite no ambiente publicado.
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Cleber e Thiago: segredo real deve ser fornecido na variável JWT_SEGREDO em produção.
jwt.segredo=${JWT_SEGREDO:local-dev-only-secret-change-this-value-0123456789-ABCD}
jwt.expiracao-ms=${JWT_EXPIRACAO_MS:28800000}

# Cleber: contas em memória do exercício (troque as senhas antes de qualquer publicação real).
usuarios.admin.usuario=${USUARIO_ADMIN:admin}
usuarios.admin.senha=${SENHA_ADMIN:admin123}
usuarios.colaborador.usuario=${USUARIO_COLABORADOR:colaborador}
usuarios.colaborador.senha=${SENHA_COLABORADOR:colaborador123}

# Thiago: endereço base consultado pelo ViaCepService.
viacep.url=${VIACEP_URL:https://viacep.com.br/ws}

# Filipe: mensagens de erro controladas pela aplicação usam o campo message.
spring.web.error.include-message=always
springdoc.swagger-ui.path=/swagger-ui.html
